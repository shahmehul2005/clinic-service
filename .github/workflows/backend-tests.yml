name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run booking, webhook, and reliability tests
        env:
          ENABLE_BACKGROUND_JOBS: "0"
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-key
          GROQ_API_KEY: mock-groq-key
          META_CLIENT_SECRET: mock-app-secret
        run: python -m pytest test_ops.py test_agent_tactics.py test_whatsapp_webhook.py test_reliability.py test_workflow.py -q
