name: Keep Services Alive

on:
  schedule:
    # Ping Render every 10 minutes during clinic hours (IST ~7:30 AM - 10:30 PM = UTC 2-17)
    - cron: '*/10 2-17 * * *'

    # Ping Supabase once daily at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'

    # Send appointment reminders every 10 minutes during clinic hours
    # Catches all time-based appointments due in the next hour
    - cron: '*/10 2-17 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/10 2-17 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to prevent spin-down..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            "${{ secrets.RENDER_BACKEND_URL }}/health" || true)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Render backend is alive"
          else
            echo "⚠️ Render backend returned status $HTTP_STATUS (may be cold-starting)"
          fi

  send-reminders:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/10 2-17 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Send Appointment Reminders
        run: |
          echo "Sending 1-hour appointment reminders..."
          HTTP_STATUS=$(curl -s -o /tmp/reminder_response.json -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"pin\": \"${{ secrets.ADMIN_PIN }}\"}" \
            "${{ secrets.RENDER_BACKEND_URL }}/api/internal/send-reminders" || true)
          echo "Response status: $HTTP_STATUS"
          cat /tmp/reminder_response.json || true
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Reminders sent successfully"
          else
            echo "⚠️ Reminder endpoint returned status $HTTP_STATUS"
          fi

  ping-supabase:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Ping Supabase
        run: |
          echo "Pinging Supabase to prevent 7-day inactivity pause..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clinics?select=id&limit=1")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Supabase is alive"
          else
            echo "⚠️ Supabase returned status $HTTP_STATUS"
          fi
